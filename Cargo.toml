[package]
name = "fts-auth"
version = "0.1.0"
edition = "2024"
publish = false
description = "The deployed FastTrackStudio identity server — auth.fasttrackstudio.app."

[dependencies]
# The reusable server lives in the architect repo; this crate is only
# the FastTrackStudio *deployment* of it.
#
# Pinned to a tag, not a branch: an auth server is the last thing that
# should change under you unnoticed.
auth-server = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.6.0" }
architect = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.6.0", features = ["server", "host"] }
eyre = "0.6"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[profile.release]
lto = "thin"
strip = true
