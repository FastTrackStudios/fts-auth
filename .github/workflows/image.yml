name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # architect is a private-adjacent sibling repo; the checkout token
      # cannot read it, so give cargo an SSH key or a PAT with repo scope.
      - name: Configure cargo git auth
        env:
          CARGO_GIT_TOKEN: ${{ secrets.ARCHITECT_READ_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${CARGO_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            CARGO_GIT_TOKEN=${{ secrets.ARCHITECT_READ_TOKEN }}
