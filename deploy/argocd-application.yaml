# Register fts-auth with ArgoCD.
#
# Applied once, by hand or from the cluster repo's app-of-apps. The
# repository is private, so ArgoCD needs a credential for it (a
# repo-scoped deploy key registered as an ArgoCD repository secret).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fts-auth
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/FastTrackStudios/fts-auth
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: fts-auth
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
