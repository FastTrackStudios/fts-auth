# Defaults are the shape of the thing, not the deployment. The cluster
# overrides host/image/clients from the starcommand service module
# (modules/services/fts-auth), which is the single source of truth for
# what actually runs.

image:
  registry: registry.starcommand.live:30050
  repository: fts-auth
  tag: latest
  pullPolicy: IfNotPresent

# Two by default: the server is stateless (all state is in Postgres) and
# sign-in being down takes every app down with it.
replicaCount: 2

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: traefik
  hosts:
    - auth.fasttrackstudio.app
  annotations: {}

# The externally visible origin. Every endpoint in the OIDC discovery
# document is derived from it, so it must not be the pod address.
baseUrl: https://auth.fasttrackstudio.app
# Stable identity, deliberately separable from the hostname: relying
# parties pin the issuer, so it must survive a move.
oidcIssuer: https://auth.fasttrackstudio.app

sessionTtlSeconds: 2592000 # 30 days
passkeyRpId: fasttrackstudio.app
# Turn on once SMTP is wired up. Until then an unverified address can
# sign in, which is the price of the thing being usable at all.
requireEmailVerification: false
# An open registration endpoint on a public issuer lets anyone mint a
# client. Clients are declared, not self-registered.
oidcDynamicRegistration: false

corsOrigins: []
# JSON array, rendered verbatim into AUTH_OIDC_CLIENTS. PUBLIC clients
# only — native apps and SPAs, which hold no secret and use PKCE.
oidcClients: "[]"

# Whether any CONFIDENTIAL client is registered. Their JSON contains a
# `client_secret`, so the list itself is a secret: it comes from the
# `oidc-clients-extra` key of the secret below rather than from these
# values, which are committed to the cluster repo. This flag only decides
# whether the server is told to read that file.
oidcConfidentialClients: false

# Outgoing mail. An empty host means the server LOGS verification and
# password-reset links rather than sending them — usable for a first
# deploy, dangerous to leave in production.
mail:
  host: ""
  port: 587
  username: ""
  from: ""

# Social sign-in and account linking (GitHub, Google). A client id turns
# a provider on; the matching client secret is the `github-client-secret`
# / `google-client-secret` key of the secret below. Register
# `<baseUrl>/auth/social/<provider>/callback` with the provider. Linked
# GitHub accounts are what `/oauth2/linked-token` hands to a relying
# party holding the `forge:github` scope.
social:
  github:
    clientId: ""
  google:
    clientId: ""

# Secret holding `auth-secret`, `database-url`, — when
# `oidcConfidentialClients` is set — `oidc-clients-extra`, and — when a
# social provider is on — `github-client-secret` / `google-client-secret`.
# Delivered by the cluster secrets app; never committed.
secretName: fts-auth-secrets

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 512Mi
