# fts-auth — the FastTrackStudio identity server, at
# auth.fasttrackstudio.app.
#
# ArgoCD syncs this directory. Everything here is namespace `fts-auth`;
# the database lives in the shared CNPG cluster (`pg-main`, namespace
# `databases`) alongside the other cluster services.
#
# Prerequisites, none of which this file creates:
#   1. A CNPG `Database` + owner role for `fts_auth` on pg-main (see
#      README — it belongs in the cluster's `databases` service, next to
#      the authelia/nextcloud entries).
#   2. Secret `fts-auth-secrets` in this namespace, with keys
#      `auth-secret` and `database-url`. Delivered by the cluster's
#      secrets app, never committed here.
#   3. A DNS record for auth.fasttrackstudio.app — external-dns creates
#      it from the Ingress below, pointed at the tunnel target.
---
apiVersion: v1
kind: Namespace
metadata:
  name: fts-auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fts-auth
  namespace: fts-auth
  labels:
    app: fts-auth
spec:
  # Two replicas: the server is stateless (all state is in Postgres),
  # and sign-in being down takes every app down with it.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: fts-auth
  template:
    metadata:
      labels:
        app: fts-auth
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fts-auth
          # Pinned by digest at deploy time. ArgoCD Image Updater (or a
          # commit from CI) rewrites this; a floating tag on an auth
          # server means an unreviewed binary can start issuing tokens.
          image: ghcr.io/fasttrackstudios/fts-auth:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AUTH_BIND_ADDR
              value: "0.0.0.0:8080"
            - name: AUTH_BASE_URL
              value: "https://auth.fasttrackstudio.app"
            # Stable identity, deliberately independent of the hostname:
            # relying parties pin the issuer, so it must survive a move.
            - name: AUTH_OIDC_ISSUER
              value: "https://auth.fasttrackstudio.app"
            - name: AUTH_SESSION_TTL_SECONDS
              value: "2592000" # 30 days
            - name: AUTH_PASSKEY_RP_ID
              value: "fasttrackstudio.app"
            - name: AUTH_REQUIRE_EMAIL_VERIFICATION
              # Turn on once SMTP is wired up. Until then an unverified
              # address can sign in, which is the tradeoff for being able
              # to use the thing at all.
              value: "false"
            - name: AUTH_OIDC_DYNAMIC_REGISTRATION
              # An open registration endpoint on a public issuer lets
              # anyone mint a client. Keep it off; clients are declared.
              value: "false"
            - name: AUTH_CORS_ORIGINS
              value: >-
                https://task.fasttrackstudio.app,
                https://session.fasttrackstudio.app,
                https://signal.fasttrackstudio.app,
                https://keyflow.fasttrackstudio.app,
                https://ignition.fasttrackstudio.app
            # The five first-party apps. All public clients (native and
            # SPA builds cannot hold a secret), so all PKCE, and all
            # consent-free — signing in to your own product is not a
            # third-party authorization.
            - name: AUTH_OIDC_CLIENTS
              value: |
                [
                  {"client_id":"task","name":"Task","public_client":true,"skip_consent":true,
                   "redirect_uris":["https://task.fasttrackstudio.app/auth/callback","http://localhost:8080/auth/callback"]},
                  {"client_id":"session","name":"Session","public_client":true,"skip_consent":true,
                   "redirect_uris":["https://session.fasttrackstudio.app/auth/callback","http://localhost:8081/auth/callback"]},
                  {"client_id":"signal","name":"Signal","public_client":true,"skip_consent":true,
                   "redirect_uris":["https://signal.fasttrackstudio.app/auth/callback","http://localhost:8082/auth/callback"]},
                  {"client_id":"keyflow","name":"Keyflow","public_client":true,"skip_consent":true,
                   "redirect_uris":["https://keyflow.fasttrackstudio.app/auth/callback","http://localhost:8083/auth/callback"]},
                  {"client_id":"ignition","name":"Ignition","public_client":true,"skip_consent":true,
                   "redirect_uris":["https://ignition.fasttrackstudio.app/auth/callback","http://localhost:8084/auth/callback"]}
                ]
            # Secrets arrive as file paths, not values: an env var is
            # visible in `kubectl describe pod` and in any crash dump.
            - name: AUTH_SECRET_FILE
              value: /var/run/secrets/fts-auth/auth-secret
            - name: AUTH_DATABASE_URL_FILE
              value: /var/run/secrets/fts-auth/database-url
          volumeMounts:
            - name: secrets
              mountPath: /var/run/secrets/fts-auth
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          # Migrations run on boot and are idempotent (verified against
          # a real Postgres in apps/auth-server/tests/postgres.rs), so a
          # rolling update is safe. `startupProbe` gives the first pod
          # room to apply them before liveness starts counting.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: secrets
          secret:
            secretName: fts-auth-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: fts-auth
  namespace: fts-auth
spec:
  selector:
    app: fts-auth
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fts-auth
  namespace: fts-auth
  annotations:
    # Same tunnel target the starcommand services use, so the record
    # external-dns creates resolves through the Cloudflare tunnel.
    external-dns.alpha.kubernetes.io/target: TUNNEL_TARGET_PLACEHOLDER
spec:
  ingressClassName: traefik
  rules:
    - host: auth.fasttrackstudio.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fts-auth
                port:
                  number: 80
---
# Sign-in must not be knocked over by a noisy neighbour rollout.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fts-auth
  namespace: fts-auth
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: fts-auth
